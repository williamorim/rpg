- amizade:
  - nome: "Amizade"
  - tipo: "Encantamento"
  - descricao: "Pela duração, você terá vantagem em todos os testes de Carisma direcionados a uma criatura, à sua escolha, que não seja hostil a você. Quando a magia acabar, a criatura perceberá que você usou maia para influenciar o humor dela, e ficará hostil a você."
  - alcance: 9
  - componentes: ["S", "M"]
  - duracao: "1 minuto"
  
- chicote_espinhos:
  - nome: "Chicote de Espinhos"
  - tipo: "Transmutação"
  - descricao: "Você cria um longo chicote de vinhas coberto por espinhos que chicoteia, ao seu comando, em direção de uma criatura dentro do alcance. Realize um ataque corpo-a-corpo com magia contra o alvo. Se o ataque atingir, a criatura sofrerá 1d6 de dano perfurante e, se a criatura for Grande ou menor, você a puxa até 3 metros para perto de você. <br><br> O dano dessa magia aumenta em 1d6 quando você alcança o 5° nível (2d6), 11° nível (3d6) e 17° nível (4d6)."
  - alcance: 9
  - componentes: ["V", "S", "M"]

- raio_de_gelo:
  - nome: "Raio de Gelo"
  - tipo: "Evocação"
  - descricao: "Um raio frigido de luz azul clara parte em direção de uma criatura, dentro do alcance. Realize um ataque à distância com magia contra o alvo. Se atingir, ele sofre 1d8 de dano de frio e seu deslocamento é reduzido em 3 metros até o começo do seu próximo turno. <br><br>O dano da magia aumenta em 1d8 quando você alcança o 5° nível (2d8), 11° nível (3d8) e 17° nível (4d8)."
  - dano: "1d8 de dano de frio"
  - alcance: 18
  - componentes: ["V", "S"]

- orientacao:
  - nome: "Orientação"
  - tipo: "Transmutação"
  - descricao: "Pela duração, você pode tocar uma criatura. Até o feitiço acabar, a criatura pode rolar um 1d4 e adicionar o número rolado a um teste de habilidade de sua escolha. Ela pode rolar o dado antes ou depois de fazer o teste. O feitiço pode ser conjurado novamente para afetar a mesma criatura, mas a magia não se acumula. O efeito dura por 1 minuto."
  - alcance: "Toque"
  - componentes: ["V", "S"]
  - duracao: "Concentração, até 1 minuto"

- toque_arrepiante:
  - nome: "Toque Arrepiante"
  - tipo: "Necromancia"
  - descricao: |
      Você cria uma mão esquelética fantasmagórica no espaço de uma criatura, dentro do alcance. Realize um ataque à distância com magia contra a criatura para afeta-la com o frio sepulcral. Se atingir, a criatura sofre 1d8 de dano necrótico e não poderá recuperar pontos de vida até o início do seu próximo turno. Até lá, a mão ficará presa ao alvo. Se você atingir um alvo morto-vivo, ele terá desvantagem nas jogadas de ataque contra você até o final do seu próximo turno. <br><br> O dano dessa magia aumenta em 1d8 quando você alcança o 5° nível (2d8), 11° nível (3d8) e 17° nível (4d8).
  - dano: "1d8 de dano necrótico"
  - alcance: "Toque"
  - componentes: ["V", "S"]


  - raio_de_fogo:
    - nome: "Raio de Fogo"
    - tipo: "Evocação"
    - descricao: "Uma rajada de chamas irrompe de sua mão em direção a uma criatura dentro do alcance. Realize um ataque à distância com magia contra o alvo. Se atingir, ele sofre 1d10 de dano de fogo. <br><br>O dano da magia aumenta em 1d10 quando você alcança o 5° nível (2d10), 11° nível (3d10) e 17° nível (4d10)."
    - dano: "1d10 de dano de fogo"
    - alcance: 36
    - componentes: ["V", "S"]

  - rajada_de_veneno:
    - nome: "Rajada de Veneno"
    - tipo: "Necromancia"
    - descricao: "Você ergue sua mão em direção de uma criatura que você possa ver, dentro do alcance e projeta um sopro de gás tóxico da sua palma. A criatura deve ser bem sucedida num teste de resistência de Constituição ou sofrerá 1d12 de dano de veneno. <br><br>O dano da magia aumenta em 1d12 quando você alcança o 5° nível (2d12), 11° nível (3d12) e 17° nível (4d12)."
    - dano: "1d12 de dano de veneno"
    - alcance: 3
    - componentes: ["V", "S"]
    